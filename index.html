<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/src-tauri/icons/32x32.png" />
    <title>miclaw_api_bridge</title>
    <script>
      // Stamp the theme before first paint so dark users don't get a light
      // flash while the bundle loads. Must stay in sync with App.vue's
      // initialTheme() (same localStorage key). Fonts are self-hosted via
      // @fontsource/inter (see main.ts) — no third-party CDN calls.
      (function () {
        try {
          var saved = localStorage.getItem("miclaw-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* storage unavailable — the light default applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
